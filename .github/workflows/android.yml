name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev
    - name: Build with Buildozer
      run: |
        buildozer init
        buildozer android debug
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MyOwnPythonApp
        path: bin/*.apk
